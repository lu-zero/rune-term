[package]
name = "rune-term-ctl"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Control CLI for rune-term."

[[bin]]
name = "rune-term-ctl"
path = "src/main.rs"

[dependencies]
rune_term = { package = "rune-term", path = "../rune-term", default-features = false }
term-control = { path = "../term-control" }
winnow-args = { version = "0.6", default-features = false, features = ["derive", "help-text"] }
serde_json = "1"

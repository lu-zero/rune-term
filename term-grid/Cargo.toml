[package]
name = "term-grid"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Cell-grid wgpu pass for rune-term. No Rune and no Rio."

[features]
default = ["bundled-font", "fallback-common"]
# Forwarded to the CPU atlas; the wgpu renderer needs no font bytes itself.
bundled-font = ["term-atlas/bundled-font"]
fallback-common = ["term-atlas/fallback-common"]
fallback-ja = ["term-atlas/fallback-ja"]
fallback-zh-full = ["term-atlas/fallback-zh-full"]
cascadia = ["term-atlas/cascadia"]

[dependencies]
bytemuck.workspace = true
term-atlas.workspace = true
wgpu.workspace = true

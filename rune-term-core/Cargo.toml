[package]
name = "rune-term-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Terminal component for rune-term."

[lib]
name = "rune_term_core"
path = "src/lib.rs"

[dependencies]
rune.workspace = true
librio.workspace = true
term-grid.workspace = true
term-host.workspace = true
term-input.workspace = true
wgpu.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
default = []
font-bundled = ["term-grid/bundled-font"]
font-fallback-common = ["term-grid/fallback-common"]
font-fallback-ja = ["term-grid/fallback-ja"]
font-fallback-zh-full = ["term-grid/fallback-zh-full"]
font-cascadia = ["term-grid/cascadia"]
pty = ["librio/graphics"]
graphics = ["librio/graphics"]

[package]
name = "term-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Generic terminal host state and input delivery. No Rune and no librio frontend."

[dependencies]
librio.workspace = true
term-grid.workspace = true
term-input.workspace = true
wgpu.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
default = []
font-bundled = ["term-grid/bundled-font"]
font-fallback-common = ["term-grid/fallback-common"]
font-fallback-ja = ["term-grid/fallback-ja"]
font-fallback-zh-full = ["term-grid/fallback-zh-full"]
font-cascadia = ["term-grid/cascadia"]

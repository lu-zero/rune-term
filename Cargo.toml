[workspace]
resolver = "2"
members = [
    "term-grid",
    "term-input",
    "term-control",
    "term-mux",
    "color-picker",
    "font-picker",
    "rune-term-core",
    "rune-term",
    "rune-term-ctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", branch = "dev" }
rune-kit = { git = "https://github.com/anomalyco/rune", branch = "dev", default-features = false }
librio = { git = "https://github.com/raphamorim/rio", branch = "main", default-features = false }
teletypewriter = { git = "https://github.com/raphamorim/rio", branch = "main" }
etcetera = "0.11"

[patch."https://github.com/anomalyco/rune"]
rune = { git = "https://github.com/lu-zero/rune", branch = "physical-key-text" }
rune-kit = { git = "https://github.com/lu-zero/rune", branch = "physical-key-text" }

[patch."https://github.com/raphamorim/rio"]
librio = { git = "https://github.com/lu-zero/rio", branch = "librio-update-rearm-reflow" }
teletypewriter = { git = "https://github.com/lu-zero/rio", branch = "librio-update-rearm-reflow" }

# Vendored winit is excluded from the rune workspace, so a git pin cannot see it.
[patch.crates-io]
winit = { path = "../rune/vendor/winit" }

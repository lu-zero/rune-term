[workspace]
resolver = "2"
members = [
    "term-grid",
    "term-input",
    "term-control",
    "color-picker",
    "font-picker",
    "rune-term-core",
    "rune-term",
    "rune-term-ctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", branch = "dev" }
rune-kit = { git = "https://github.com/anomalyco/rune", branch = "dev", default-features = false }
librio = { git = "https://github.com/raphamorim/rio", branch = "main", default-features = false }

[patch."https://github.com/anomalyco/rune"]
rune = { path = "../rune/crates/rune" }
rune-kit = { path = "../rune/crates/rune-kit" }

[patch."https://github.com/raphamorim/rio"]
librio = { git = "https://github.com/lu-zero/rio", branch = "librio-update-rearm-reflow" }

[patch.crates-io]
winit = { path = "../rune/vendor/winit" }

[workspace]
resolver = "2"
members = [
    "term-grid",
    "term-input",
    "term-control",
    "term-mux",
    "term-roam",
    "color-picker",
    "font-picker",
    "rune-term-core",
    "rune-term",
    "rune-term-ctl",
    "rune-term-agent",
    "rune-term-keeper",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
# In-tree crates.
color-picker = { path = "color-picker" }
font-picker = { path = "font-picker" }
rune-term = { path = "rune-term", default-features = false }
rune-term-core = { path = "rune-term-core", default-features = false }
rune-term-keeper = { path = "rune-term-keeper" }
term-control = { path = "term-control" }
term-grid = { path = "term-grid" }
term-input = { path = "term-input" }
term-mux = { path = "term-mux" }
term-roam = { path = "term-roam" }

rune = { git = "https://github.com/anomalyco/rune", branch = "dev" }
rune-kit = { git = "https://github.com/anomalyco/rune", branch = "dev", default-features = false }
librio = { git = "https://github.com/raphamorim/rio", branch = "main", default-features = false }
teletypewriter = { git = "https://github.com/raphamorim/rio", branch = "main" }

bytemuck = { version = "1", features = ["derive"] }
core-foundation = "0.10.1"
core-graphics = "0.24.0"
core-text = "21.0.0"
etcetera = "0.11"
fontique = { version = "0.12", default-features = false, features = ["std", "system", "fontconfig-dlopen"] }
libc = "0.2"
okhsl = "1.0.3"
png = "0.18"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swash = "0.2.10"
tiny-skia = "0.12"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
toml = "0.8"
wgpu = { version = "=30.0.1", default-features = false, features = ["wgsl"] }
winnow-args = { version = "0.6", default-features = false, features = ["derive", "help-text"] }

[patch."https://github.com/anomalyco/rune"]
rune = { git = "https://github.com/lu-zero/rune", branch = "physical-key-text" }
rune-kit = { git = "https://github.com/lu-zero/rune", branch = "physical-key-text" }

[patch."https://github.com/raphamorim/rio"]
librio = { git = "https://github.com/lu-zero/rio", branch = "rune-term-on-main" }
teletypewriter = { git = "https://github.com/lu-zero/rio", branch = "rune-term-on-main" }

# The crates Rune vendors, which an app that builds Rune patches as Rune does. Its workspace
# excludes them, but cargo finds every package in a git checkout.
[patch.crates-io]
accesskit_macos = { git = "https://github.com/lu-zero/rune", branch = "physical-key-text" }
accesskit_windows = { git = "https://github.com/lu-zero/rune", branch = "physical-key-text" }
parley_engine = { git = "https://github.com/lu-zero/rune", branch = "physical-key-text" }
winit = { git = "https://github.com/lu-zero/rune", branch = "physical-key-text" }

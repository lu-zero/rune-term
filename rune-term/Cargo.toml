[package]
name = "rune-term"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Rune shell over librio."

[lib]
name = "rune_term"
path = "src/lib.rs"

[[bin]]
name = "rune-term"
path = "src/main.rs"

[dependencies]
rune = { path = "../../rune/crates/rune" }
librio = { path = "../../rio/librio", default-features = false }
term-grid = { path = "../term-grid" }
term-input = { path = "../term-input" }
wgpu = { version = "=30.0.1", default-features = false, features = ["wgsl"] }

[features]
default = ["pty"]
pty = ["librio/pty", "librio/graphics"]
graphics = ["librio/graphics"]

[dev-dependencies]
png = "0.18"

[package]
name = "rune-term"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Rune shell over librio."

[lib]
name = "rune_term"
path = "src/lib.rs"

[[bin]]
name = "rune-term"
path = "src/main.rs"

[dependencies]
rune-term-core.workspace = true
term-control.workspace = true
term-mux.workspace = true
rune.workspace = true
rune-kit.workspace = true
librio.workspace = true
teletypewriter = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
term-grid.workspace = true
term-input.workspace = true
color-picker.workspace = true
wgpu.workspace = true
serde.workspace = true
toml.workspace = true
etcetera.workspace = true
winnow-args.workspace = true
okhsl.workspace = true

[features]
default = ["pty"]
pty = ["dep:teletypewriter", "dep:libc", "librio/graphics", "rune-term-core/pty"]
graphics = ["librio/graphics", "rune-term-core/graphics"]

[dev-dependencies]
png.workspace = true

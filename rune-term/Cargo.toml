[package]
name = "rune-term"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Rune shell over term-vt."

[lib]
name = "rune_term"
path = "src/lib.rs"

[[bin]]
name = "rune-term"
path = "src/main.rs"

[dependencies]
rune-term-core.workspace = true
rune-term-keeper = { workspace = true, optional = true }
term-control.workspace = true
term-mux.workspace = true
term-roam.workspace = true
rune.workspace = true
font-picker.workspace = true
rune-kit.workspace = true
term-vt.workspace = true
teletypewriter = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
term-grid.workspace = true
term-input.workspace = true
color-picker.workspace = true
wgpu.workspace = true
serde.workspace = true
toml.workspace = true
etcetera.workspace = true
winnow-args.workspace = true
okhsl.workspace = true

[features]
default = ["pty", "font-bundled", "font-fallback-common", "emoji-fallback"]
# One embedded face is the base; optional tiers add coverage and binary weight.
font-bundled = ["term-grid/bundled-font", "rune-term-core/font-bundled"]
font-fallback-common = ["term-grid/fallback-common", "rune-term-core/font-fallback-common"]
font-fallback-ja = ["term-grid/fallback-ja", "rune-term-core/font-fallback-ja"]
font-fallback-zh-full = ["term-grid/fallback-zh-full", "rune-term-core/font-fallback-zh-full"]
emoji-fallback = ["term-grid/emoji-fallback", "rune-term-core/emoji-fallback"]
font-cascadia = ["term-grid/cascadia", "rune-term-core/font-cascadia"]
pty = [
    "dep:teletypewriter",
    "dep:libc",
    "dep:rune-term-keeper",
    "term-vt/graphics",
    "rune-term-core/pty",
]
graphics = ["term-vt/graphics", "rune-term-core/graphics"]

[dev-dependencies]
png.workspace = true

[package]
name = "rune-term"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Rune shell over librio."

[lib]
name = "rune_term"
path = "src/lib.rs"

[[bin]]
name = "rune-term"
path = "src/main.rs"

[dependencies]
rune-term-core = { path = "../rune-term-core", default-features = false }
term-control = { path = "../term-control" }
rune.workspace = true
librio.workspace = true
term-grid = { path = "../term-grid" }
term-input = { path = "../term-input" }
color-picker = { path = "../color-picker" }
font-picker = { path = "../font-picker" }
wgpu = { version = "=30.0.1", default-features = false, features = ["wgsl"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
etcetera = "0.11"
winnow-args = { version = "0.6", default-features = false, features = ["derive", "help-text"] }

[features]
default = ["pty"]
pty = ["librio/pty", "librio/graphics", "rune-term-core/pty"]
graphics = ["librio/graphics", "rune-term-core/graphics"]

[dev-dependencies]
png = "0.18"
